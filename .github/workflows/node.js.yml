name: Node.js CI
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
        service: [core-api, web, workflow]  # ← your 3 services
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json  # ← correct path

      - run: npm ci
        working-directory: services/${{ matrix.service }}  

      - run: npm run build --if-present
        working-directory: services/${{ matrix.service }}

      - run: npm test
        working-directory: services/${{ matrix.service }}
